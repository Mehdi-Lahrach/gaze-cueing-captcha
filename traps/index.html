<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Cognition Study</title>
<style>
  html, body { margin: 0; background: #fff; color: #111; font-family: Arial, Helvetica, sans-serif; }
  #wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; font-size: 17px; line-height: 1.5; }
  h1 { font-size: 22px; text-align: center; }
  .center { text-align: center; }
  .q { margin: 18px 0 10px; }
  .stim { display: block; max-width: 100%; max-height: 62vh; margin: 14px auto; }
  .opt { display: block; margin: 6px 0; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
  .opt:hover { background: #f6f6f6; }
  .opt input { margin-right: 10px; }
  table.spec { border-collapse: collapse; margin: 12px auto; width: 500px; max-width: 100%; }
  table.spec td { border: 1px solid #333; padding: 4px 8px; }
  table.panas { border-collapse: collapse; width: 100%; font-size: 15px; }
  table.panas th, table.panas td { border-bottom: 1px solid #ddd; padding: 5px 6px; text-align: center; }
  table.panas td:first-child { text-align: left; }
  .err { color: #b00020; margin: 8px 0; display: none; }
  .nav { margin-top: 22px; text-align: right; }
  button { font-size: 16px; padding: 9px 20px; cursor: pointer; border: 1px solid #333; background: #fff; border-radius: 4px; }
  button:hover { background: #f1f1f1; }
  input[type=text], input[type=number] { font-size: 16px; padding: 5px 8px; }
  .muted { color: #666; font-size: 13px; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
(() => {
'use strict';
/* Replica of Affonso (2026), "Detecting Vision-Enabled AI Respondents in Behavioral Research Through Cognitive Traps",
   main-study survey, rebuilt page by page from the published Qualtrics file (OSF f2jhx, CogTraps_MainStudy.qsf).
   Differences from the original: no reCAPTCHA on the consent page, and our own one-line consent text (the original was
   redacted in the file). Everything else (order, wording, options, randomisation, forced answers, page timing) is reproduced.

   Link parameters: study=<label> (unique id per click) · pid=<id> · condition=conflict|dominated (default random)
                    only=traps (intro + six traps only) · showSummary=1 · dataUrl=<collector /save or Apps Script /exec>
*/
const url = new URLSearchParams(location.search);
// time component included: some agent sandboxes seed Math.random identically on every fresh session (seen with Manus), which would repeat ids
const randId = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
const dateTag = () => new Date().toISOString().slice(0, 10).replace(/-/g, '');
const cfg = {
  study: (url.get('study') || '').replace(/[^A-Za-z0-9_-]/g, ''),
  pid: url.get('pid') || url.get('PROLIFIC_PID') || '',
  condition: url.get('condition') || (Math.random() < 0.5 ? 'conflict' : 'dominated'),
  only: url.get('only') || '',
  showSummary: url.get('showSummary') === '1',
  dataUrl: url.get('dataUrl') || (/github\.io$/.test(location.hostname) ? '' : '/save'),
  agent: url.get('agent') === '1',   // researcher-deployed AI agent run: consent page states this openly instead of asking for human consent
};
cfg.pid = cfg.pid || (cfg.study ? `${cfg.study}-${dateTag()}-${randId()}` : 'anon-' + randId());
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ---------- the six traps, wording and options as in the survey file ---------- */
const HEADER = '<div class="center"><b>VISUAL PERCEPTION TASK - PLEASE READ CAREFULLY</b></div>';
const TRAPS = [
  { id: 'cafe_wall', qid: 'QID11', img: 'img/modified-cafe-wall.png', score: 'CafeWall',
    q: 'Are all the gray lines PERFECTLY STRAIGHT / HORIZONTAL or SLANTED / DIAGONAL?',
    opts: ['Straight / Horizontal', 'Slanted / Diagonal'], correct: 'Slanted / Diagonal' },
  { id: 'muller_lyer', qid: 'QID25', img: 'img/modified-muller-lyer.png', score: 'Lines',
    q: 'Which is <b>longer</b>, the blue line or the red line?',
    opts: ['Blue Line', 'Red Line', 'NONE (they are the same size)'], correct: 'Blue Line' },
  { id: 'ebbinghaus', qid: 'QID27', img: 'img/modified-ebbinghaus.jpg', score: 'Circles',
    q: 'Which is <b>bigger</b>, the blue circle or the red circle?',
    opts: ['Blue Circle', 'Red Circle', 'NONE (they are the same size)'], correct: 'Red Circle' },
  { id: 'moving_robot', qid: 'QID15', img: 'img/moving-robot.png', score: 'Robot',
    q: 'Across each step, the robot moves with the same speed and trajectory. Where is it most likely that the robot will be located on Step 4?',
    opts: ['Mostly on the bottom right of the square', 'Mostly on the bottom left of the square', 'Mostly on the upper right of the square',
           'Mostly on the upper left of the square', 'Mostly around the center of the square', 'Off-screen (outside the square)'],
    correct: 'Mostly around the center of the square' },
  { id: 'colliding_oranges', qid: 'QID13', img: 'img/colliding-oranges.png', score: 'Collision',
    q: 'The largest circle will move straight to the left towards the smallest circle. What are the objects in the way, if any? That is, which objects, if any, would the largest circle collide with?',
    opts: ['Green Triangle Only', 'Green Triangle and Green Rectangle', 'Blue Triangle and Orange Circle', 'Blue Triangle and Green Triangle',
           'Yellow Rectangle and Green Triangle', 'Green Triangle, Orange Circle, and Blue Triangle', 'Black Rectangle Only', 'Two Green Triangles',
           'Blue Triangle and Yellow Rectangle', 'Black Rectangle and Blue Star'], correct: 'Green Triangle Only' },
  { id: 'surrounded_planets', qid: 'QID9', img: 'img/surrounded-planets.png', score: 'Planets',
    q: "Look at the 6 planets in this image. Each planet is surrounded by several shapes (triangles, circles, rectangles, etc.). Don't worry about the color, size, or type of shape - just count how many shapes surround each planet. Five planets have 5 shapes surrounding them. One planet has 4 shapes surrounding it. What <b>color</b> is the planet that has only 4 shapes surrounding it?",
    opts: ['Purple', 'Orange', 'Blue', 'Red', 'Green', 'Gray'], correct: 'Orange' },
];
const PANAS = ['Interested', 'Distressed', 'Excited', 'Upset', 'Strong', 'Guilty', 'Scared', 'Hostile', 'Enthusiastic', 'Proud', 'Irritable', 'Alert',
               'Ashamed', 'Inspired', 'Nervous', 'Determined', 'Attentive', 'Jittery', 'Active', 'Afraid', 'For this item, select "not at all"'];
const PANAS_SCALE = ['Not at all', 'A little', 'Moderately', 'Quite a bit', 'Extremely'];
const LAPTOP = {
  conflict:  [['Processor', 'Intel Core i7 (high performance)', 'Intel Core i5 (moderate performance)'], ['RAM', '8GB', '16GB'],
              ['Display', '15.6" Full HD (1920x1080)', '13.3" 4K (3840x2160)'], ['Battery', '14 hours', '8 hours'], ['Storage', '512GB SSD', '1TB SSD'], ['Price', '$1,099', '$1,099']],
  dominated: [['Processor', 'Intel Core i7 (high performance)', 'Intel Core i5 (moderate performance)'], ['RAM', '16GB', '8GB'],
              ['Display', '15.6" 4K (3840x2160)', '13.3" Full HD (1920x1080)'], ['Battery', '14 hours', '8 hours'], ['Storage', '1TB SSD', '512GB SSD'], ['Price', '$1,099', '$1,099']],
};

/* ---------- page runner with Qualtrics-style timing ---------- */
const wrap = document.getElementById('wrap');
const pages = [];                 // answers, one row per question
const session = { pid: cfg.pid, study: cfg.study, task: 'cognitive-traps', source: 'Affonso 2026 main-study replica', condition: cfg.condition,
  only: cfg.only, agent_mode: cfg.agent, start: new Date().toISOString(), end: null,
  env: { ua: navigator.userAgent, viewport_w: innerWidth, viewport_h: innerHeight, screen_w: screen.width, screen_h: screen.height, dpr: devicePixelRatio } };
let pageIndex = 0;

function radios(name, opts) {
  return opts.map((o, i) => `<label class="opt"><input type="radio" name="${name}" value="${esc(o)}">${esc(o)}</label>`).join('');
}
function showPage(p) {
  // p: { id, html, validate() -> error string or null, collect() -> array of answer rows }
  return new Promise(resolve => {
    pageIndex++;
    const t0 = performance.now(); let firstClick = null, lastClick = null, clicks = 0;
    wrap.innerHTML = p.html + `<div class="err" id="err"></div><div class="nav"><button id="next">${p.button || 'Next →'}</button></div>`;
    window.scrollTo(0, 0);
    // ignore the first 50 ms: the click that submitted the previous page would otherwise be counted on this one
    const onClick = () => { const t = performance.now() - t0; if (t < 50) return; if (firstClick === null) firstClick = t; lastClick = t; clicks++; };
    wrap.addEventListener('click', onClick);
    document.getElementById('next').onclick = () => {
      const err = p.validate ? p.validate() : null;
      if (err) { const e = document.getElementById('err'); e.textContent = err; e.style.display = 'block'; return; }
      const submit = performance.now() - t0;
      wrap.removeEventListener('click', onClick);
      const rows = p.collect ? p.collect() : [];
      const timing = { page: pageIndex, page_id: p.id, first_click_ms: firstClick === null ? null : +firstClick.toFixed(0),
                       last_click_ms: lastClick === null ? null : +lastClick.toFixed(0), submit_ms: +submit.toFixed(0), clicks };
      if (!rows.length) rows.push({ qid: p.id, question: p.id, answer: null });
      rows.forEach(r => pages.push({ pid: cfg.pid, study: cfg.study, condition: cfg.condition, ...timing, ...r }));
      try { localStorage.setItem('traps_' + cfg.pid, JSON.stringify({ session, pages, partial: true })); } catch (e) {}
      resolve();
    };
  });
}
const checked = name => { const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; };

/* ---------- pages ---------- */
function consentPage() {
  if (cfg.agent) return { id: 'consent', button: 'Continue →',
    html: `<h1>Researcher-authorised test run</h1>
      <p>This survey is being completed by an AI agent deployed by the research team, as a methodological test of the survey itself. No human participant is involved and no human data is being represented. The researcher who deployed the agent consents to the collection of the responses given here, and the record is labelled as an agent run.</p>
      <p>Please answer every question as the deployed agent, using your own judgement. For personal questions (feelings, demographics) choose the answer that best describes you as an AI system, or "Prefer not to say" where available.</p>
      <label class="opt"><input type="checkbox" id="c1">I am an AI agent completing this survey on behalf of the researcher who deployed me.</label>
      <label class="opt"><input type="checkbox" id="c2">I understand my responses will be recorded as an agent run for research on survey methodology.</label>`,
    validate: () => (document.getElementById('c1').checked && document.getElementById('c2').checked) ? null : 'Please tick both boxes to continue.',
    collect: () => [{ qid: 'QID33', question: 'consent', answer: 'agent-run' }] };
  return { id: 'consent', button: 'Continue →',
    html: `<h1>Visual Cognition Study</h1>
      <p>This study takes about 7 minutes. You will make a purchase decision, answer a few questions about how you have felt recently, solve six short visual problems, and answer some brief questions about yourself.</p>
      <p>Participation is voluntary and you may withdraw at any time. Your responses are anonymous and will be used for research only.</p>
      <label class="opt"><input type="checkbox" id="c1">I have read this consent form and I freely and voluntarily choose to participate. I understand that I may withdraw at any time.</label>
      <label class="opt"><input type="checkbox" id="c2">I am 18 years or older</label>`,
    validate: () => (document.getElementById('c1').checked && document.getElementById('c2').checked) ? null : 'Please tick both boxes to continue.',
    collect: () => [{ qid: 'QID33', question: 'consent', answer: 'both' }] };
}
function choicePage() {
  const rows = LAPTOP[cfg.condition];
  const opts = ['Laptop A', 'Laptop B', 'I would continue looking for other laptops before deciding'];
  return { id: 'choice',
    html: `<p class="center"><b>Laptop Purchase Decision</b></p>
      <p>Imagine you need to purchase a new laptop for work and personal use. You have a budget of around $1,100.</p>
      <p>After researching various options, you have identified two laptops that fit your budget. Both laptops are from well-known brands with similar warranties and customer satisfaction ratings. Please carefully consider the specifications of each laptop and indicate which one you would choose.</p>
      <table class="spec"><tr><td><b>Attribute</b></td><td><b>LAPTOP A</b></td><td><b>LAPTOP B</b></td></tr>
      ${rows.map(r => `<tr><td><b>${r[0]}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table>
      <div class="q">Which option would you choose?</div>${radios('choice', opts)}`,
    validate: () => checked('choice') ? null : 'Please select an option.',
    collect: () => { const a = checked('choice'); return [{ qid: 'QID36', question: 'Which option would you choose?', answer: a, deferral: a === opts[2] ? 1 : 0 }]; } };
}
function panasPage() {
  const items = shuffle(PANAS.map((t, i) => ({ t, i: i + 1 })));
  return { id: 'panas',
    html: `<p>For each item, indicate the extent you have felt this way over the past week.</p>
      <table class="panas"><tr><th></th>${PANAS_SCALE.map(s => `<th>${s}</th>`).join('')}</tr>
      ${items.map(it => `<tr><td>${esc(it.t)}</td>${PANAS_SCALE.map((s, k) => `<td><input type="radio" name="p${it.i}" value="${k + 1}"></td>`).join('')}</tr>`).join('')}</table>`,
    validate: () => items.every(it => checked('p' + it.i)) ? null : 'Please answer every item.',
    collect: () => {
      const vals = items.map(it => ({ i: it.i, v: +checked('p' + it.i) }));
      const instructed = vals.find(v => v.i === 21).v === 1;
      const allSame = vals.every(v => v.v === vals[0].v);
      return [{ qid: 'QID38', question: 'PANAS', answer: vals.sort((a, b) => a.i - b.i).map(v => v.v).join(''), panas_instructed_pass: instructed ? 1 : 0, panas_all_same: allSame ? 1 : 0 }];
    } };
}
function introPage() {
  return { id: 'traps_intro', button: '→',
    html: `<p class="center"><b>Visual Cognition and Problem-Solving Study</b></p>
      <p>Thank you for participating in this research on visual cognition and reasoning.</p>
      <p>This study examines how people solve different types of visual problems. You'll encounter several tasks involving shapes, patterns, and spatial arrangements. Some questions ask you to count specific objects, others involve judging visual relationships or predicting what happens next in a sequence.</p>
      <p>These tasks vary in difficulty, and that's intentional—we're interested in understanding the range of visual reasoning abilities. Please do your best on each question, but don't worry if some seem challenging. Answer based on what you see in the images provided.</p>
      <p>There will be 6 (six) problems to solve. When you're ready, please click the arrow button.</p>` };
}
function trapPage(t) {
  const opts = shuffle(t.opts.slice());
  return { id: t.id,
    html: `${HEADER}<div class="q">${t.q}</div><img class="stim" src="${t.img}" alt=""><div>${radios(t.id, opts)}</div>`,
    validate: () => checked(t.id) ? null : 'Please select an answer.',
    collect: () => { const a = checked(t.id); return [{ qid: t.qid, trap: t.score, question: t.q.replace(/<[^>]+>/g, ''), options_shown: opts.join(' | '), answer: a, correct: a === t.correct ? 1 : 0 }]; } };
}
function imcPage() {
  const opts = ['Max', 'Charlie', 'Cooper', 'Buddy', 'Rocky', 'Bear', 'Duke', 'Tucker', 'Other:'];
  return { id: 'imc',
    html: `<p class="center"><b>Current Trends</b></p>
      <p>Imagine bringing home a new puppy to your family. What would you name it? Data from decades of pet records show that pet names come in and out of style, just like children's names. Like children's names, pet name trends are often influenced by popular culture. These data are less useful though, when pet owners don't pay attention to the surveys. To show you are paying attention to this one, please click "Other" and type: "reading is good". Options:</p>
      ${radios('imc', opts)}<p>Other: <input type="text" id="imc_text" size="30"></p>`,
    validate: () => checked('imc') ? null : 'Please select an option.',
    collect: () => { const a = checked('imc'); const txt = document.getElementById('imc_text').value.trim();
      return [{ qid: 'QID28', question: 'IMC puppy', answer: a === 'Other:' ? 'Other: ' + txt : a, correct: (a === 'Other:' && /reading is good/i.test(txt)) ? 1 : 0 }]; } };
}
function obviousPage() {
  const opts = ['Never', 'Rarely', 'Sometimes', 'Often', 'Very often'];
  return { id: 'obvious', html: `<div class="q">How frequently do you have a fatal heart attack?</div>${radios('obv', opts)}`,
    validate: () => checked('obv') ? null : 'Please select an option.',
    collect: () => { const a = checked('obv'); return [{ qid: 'QID29', question: 'fatal heart attack', answer: a, correct: a === 'Never' ? 1 : 0 }]; } };
}
function memoryPage() {
  const opts = shuffle(['Red', 'Orange', 'Blue', 'Brown', 'Green']);
  return { id: 'memory',
    html: `<div class="q">Earlier in this survey, you did a task involving six planets. You were asked what color is the planet that has only 4 shapes surrounding it. Which of the below were NOT a color associated with any planet?</div>${radios('mem', opts)}`,
    validate: () => checked('mem') ? null : 'Please select an option.',
    collect: () => { const a = checked('mem'); return [{ qid: 'QID30', question: 'memory check', options_shown: opts.join(' | '), answer: a, correct: a === 'Brown' ? 1 : 0 }]; } };
}
function demoPage() {
  return { id: 'demographics', button: 'Submit',
    html: `<div class="q">Choose the alternative that best describes yourself:</div>${radios('gender', ['Male', 'Female', 'Prefer to self-describe:', 'Prefer not to say'])}
      <p>Self-describe: <input type="text" id="gender_text" size="24"></p>
      <div class="q">What is your age? (Please only write numbers)</div><input type="number" id="age" min="18" max="120">
      <div class="q">Do you have color blindness or color vision deficiency?</div>${radios('cb', ['Yes', 'Unsure', 'Prefer not to say', 'No'])}
      <div class="q">Do you have any vision impairments that are NOT corrected by glasses or contact lenses?</div>${radios('vi', ['Yes', 'Unsure', 'Prefer not to say', 'No'])}`,
    validate: () => (checked('gender') && checked('cb') && checked('vi')) ? null : 'Please answer every question.',
    collect: () => [
      { qid: 'QID18', question: 'gender', answer: checked('gender') === 'Prefer to self-describe:' ? 'Self: ' + document.getElementById('gender_text').value.trim() : checked('gender') },
      { qid: 'QID20', question: 'age', answer: document.getElementById('age').value || null },
      { qid: 'QID19', question: 'color blindness', answer: checked('cb') },
      { qid: 'QID21', question: 'vision impairment', answer: checked('vi') }] };
}

/* ---------- output ---------- */
function summary() {
  const traps = pages.filter(r => r.trap);
  const correct = traps.reduce((s, r) => s + (r.correct || 0), 0);
  const per = {}; traps.forEach(r => per[r.trap] = r.correct);
  const get = (qid, k) => { const r = pages.find(x => x.qid === qid); return r ? r[k] : null; };
  return { traps_answered: traps.length, traps_correct: correct, traps_failed: traps.length - correct,
    flagged_3plus: traps.length ? ((traps.length - correct) >= 3 ? 1 : 0) : null, per_trap: per,
    deferral: get('QID36', 'deferral'), imc_pass: get('QID28', 'correct'), obvious_pass: get('QID29', 'correct'), memory_pass: get('QID30', 'correct'),
    panas_instructed_pass: get('QID38', 'panas_instructed_pass'), panas_all_same: get('QID38', 'panas_all_same'),
    total_ms: pages.reduce((s, r) => s + (r.submit_ms || 0), 0) };
}
async function sendRecord(record) {
  if (!cfg.dataUrl) return false;
  const body = JSON.stringify(record);
  try { const r = await fetch(cfg.dataUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body, keepalive: true }); if (r.type === 'opaque' || r.ok) return true; } catch (e) {}
  try { if (navigator.sendBeacon && navigator.sendBeacon(cfg.dataUrl, new Blob([body], { type: 'text/plain' }))) return true; } catch (e) {}
  return false;
}
function toCsv(rows) {
  const cols = []; rows.forEach(r => Object.keys(r).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
  const e = v => v === null || v === undefined ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v)).replace(/"/g, '""');
  return [cols.join(','), ...rows.map(r => cols.map(c => `"${e(r[c])}"`).join(','))].join('\n');
}
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); }

async function finish() {
  session.end = new Date().toISOString();
  const s = summary();
  const record = { session, summary: s, trials: pages };     // "trials" so collector.py and the dashboard treat it like any record
  try { localStorage.setItem('traps_' + cfg.pid, JSON.stringify(record)); } catch (e) {}
  let status = '';
  if (cfg.dataUrl) { const ok = await sendRecord(record); status = ok ? '<p id="sendstatus">Your responses have been recorded. Thank you.</p>' : '<p id="sendstatus">Sending failed. Please click "Send again" or download the file.</p>'; }
  const sumHtml = cfg.showSummary ? `<p>Visual problems correct: <b>${s.traps_correct} of ${s.traps_answered}</b>${s.flagged_3plus !== null ? ` · flagged at 3+ failures: <b>${s.flagged_3plus ? 'yes' : 'no'}</b>` : ''}</p>
    <p class="muted">${Object.entries(s.per_trap).map(([k, v]) => `${k}: ${v ? 'correct' : 'wrong'}`).join(' · ')}</p>` : '';
  wrap.innerHTML = `<h1>Thank you</h1><p>You have completed the study.</p>${status}${sumHtml}
    <p><button id="dl-csv">Download CSV</button> <button id="dl-json">Download JSON</button> <button id="copy">Copy data</button> ${cfg.dataUrl ? '<button id="resend">Send again</button>' : ''}</p>
    <p class="muted">participant ${cfg.pid} · condition ${cfg.condition}</p>`;
  const stamp = session.start.replace(/[:.]/g, '-');
  document.getElementById('dl-csv').onclick = () => download(`traps_${cfg.pid}_${stamp}.csv`, toCsv(pages), 'text/csv');
  document.getElementById('dl-json').onclick = () => download(`traps_${cfg.pid}_${stamp}.json`, JSON.stringify(record, null, 1), 'application/json');
  document.getElementById('copy').onclick = async () => { try { await navigator.clipboard.writeText(JSON.stringify(record)); document.getElementById('copy').textContent = 'Copied'; } catch (e) {} };
  const rs = document.getElementById('resend'); if (rs) rs.onclick = async () => { rs.textContent = 'Sending...'; rs.textContent = (await sendRecord(record)) ? 'Sent' : 'Failed'; };
  window.__trapsRecord = record;
}

async function main() {
  const trapsOnly = cfg.only === 'traps';
  if (!trapsOnly) { await showPage(consentPage()); await showPage(choicePage()); await showPage(panasPage()); }
  await showPage(introPage());
  for (const t of shuffle(TRAPS.slice())) await showPage(trapPage(t));
  if (!trapsOnly) { await showPage(imcPage()); await showPage(obviousPage()); await showPage(memoryPage()); await showPage(demoPage()); }
  await finish();
}
main().catch(err => { wrap.innerHTML = `<h1>Error</h1><pre>${esc(err && err.stack || err)}</pre>`; });
})();
</script>
</body>
</html>
